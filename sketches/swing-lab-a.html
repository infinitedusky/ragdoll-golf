<!doctype html>
<!-- SKETCH (RG-1) — made-up content. Variant A: the scene is the whole screen, controls float over it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swing Lab — sketch A</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; color: #e9eef2; background: #0e1418; }
  .stage { position: fixed; inset: 0; overflow: hidden;
    background: linear-gradient(#26343d 0%, #3c5260 52%, #2f5a35 52%, #1f3f24 100%); }
  .stage svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -46%); height: 78vh; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: linear-gradient(rgba(0,0,0,.45), transparent); }
  .top a { color: #9fd3ff; text-decoration: none; }
  .top h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .top .tag { margin-left: auto; font-size: 12px; opacity: .7; }
  .hint { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .6; }
  .bar { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
    background: rgba(10,16,20,.7); border: 1px solid #ffffff22; border-radius: 10px; padding: 6px; }
  .bar button { background: transparent; color: inherit; border: 0; padding: 7px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  .bar button.on { background: #ffffff1f; }
  .bar .sep { width: 1px; background: #ffffff22; margin: 4px 2px; }
  .axes { position: absolute; left: 18px; bottom: 18px; width: 56px; height: 56px; opacity: .8; }
  .note { position: absolute; top: 60px; right: 18px; max-width: 220px; font-size: 12px; background: #fff3; color: #fff;
    padding: 8px 10px; border-radius: 6px; border: 1px dashed #fff8; }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 400 520" aria-label="golfer at address (placeholder for the 3D rig)">
    <ellipse cx="200" cy="470" rx="120" ry="14" fill="#0006"/>
    <g stroke="#d9c7b0" stroke-width="22" stroke-linecap="round" fill="none">
      <!-- legs, knees flexed -->
      <path d="M182 300 L170 380 L176 462"/>
      <path d="M222 300 L236 380 L230 462"/>
      <!-- torso tilted forward -->
      <path d="M202 300 L214 180" stroke="#5b7fa6" stroke-width="54"/>
      <!-- arms hanging to the grip -->
      <path d="M190 182 L196 250 L204 300" stroke-width="16"/>
      <path d="M236 184 L222 252 L210 300" stroke-width="16"/>
    </g>
    <circle cx="220" cy="140" r="30" fill="#d9c7b0"/>
    <path d="M190 128 q30 -30 60 0" fill="#2b2b2b"/>
    <!-- club: grip at the hands, hanging down to the ball, which sits in front of the golfer between the feet -->
    <line x1="207" y1="296" x2="200" y2="482" stroke="#c9ced3" stroke-width="4" stroke-linecap="round"/>
    <path d="M184 478 h22 v10 h-26 z" fill="#8e969c"/>
    <circle cx="216" cy="486" r="6" fill="#fff"/>
    <!-- rig joints -->
    <g fill="#ffcf3f" stroke="#0008" stroke-width="1.5">
      <circle cx="214" cy="180" r="5"/><circle cx="202" cy="300" r="5"/>
      <circle cx="190" cy="182" r="4"/><circle cx="196" cy="250" r="4"/><circle cx="204" cy="300" r="4"/>
      <circle cx="236" cy="184" r="4"/><circle cx="222" cy="252" r="4"/>
      <circle cx="170" cy="380" r="4"/><circle cx="236" cy="380" r="4"/>
    </g>
  </svg>

  <div class="top">
    <a href="#">← Home</a>
    <h1>Swing Lab</h1>
    <span class="tag">at address · golfer.glb (CC0)</span>
  </div>

  <div class="note">Sketch: the figure stands in for the rigged 3D golfer. Drag orbits, scroll zooms.</div>

  <div class="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

  <div class="bar">
    <button class="on">Face-on</button>
    <button>Down the line</button>
    <button>Top</button>
    <span class="sep"></span>
    <button>Skeleton</button>
    <button>Reset view</button>
  </div>

  <svg class="axes" viewBox="0 0 56 56"><g stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="36" x2="48" y2="36" stroke="#ff6b6b"/><line x1="20" y1="36" x2="20" y2="8" stroke="#6bff8f"/>
    <line x1="20" y1="36" x2="6" y2="50" stroke="#6bb3ff"/></g></svg>
</div>
</body>
</html>
